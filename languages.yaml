en:
  PLUGIN_CONVERTER_STUDIO:
    ACCOUNT: Converter Studio account
    API_KEY: API key
    API_KEY_HELP: Make one on your account page at converter.studio (API keys). A saved key is not shown again; leave the field as it is to keep it. Without a key here, the CONVERTER_STUDIO_API_KEY environment variable is used, which keeps the key out of user/config.
    API_URL: API address
    API_URL_HELP: Leave it as it is. Only change it to try the plugin against a test server.
    ON_UPLOAD: Convert when uploaded in the Admin
    ON_UPLOAD_TEXT: Each kind of file converts only when it is switched on here. A conversion uses credits of your Converter Studio account. Files uploaded by visitors through forms are never converted. Existing files convert with bin/plugin converter-studio convert.
    HEIC: iPhone photos (HEIC, HEIF)
    HEIC_HELP: Only Safari shows HEIC, and Grav cannot make thumbnails or resized copies of it. Switching this on also lets the Admin accept HEIC uploads.
    HEIC_TO: iPhone photos become
    RAW: Camera RAW photos (DNG, CR2, NEF, ARW)
    RAW_HELP: Browsers cannot show RAW files. Switching this on also lets the Admin accept them.
    RAW_TO: RAW photos become
    TIFF: TIFF and BMP images
    TIFF_HELP: Most browsers do not show TIFF, and Grav treats TIFF and BMP as plain files, without thumbnails or resizing.
    TIFF_TO: TIFF and BMP images become
    VIDEO: Videos (MOV, AVI, MKV, WMV, FLV, 3GP)
    VIDEO_HELP: Converted to a video every browser plays. Longer videos finish after the upload, through Grav's scheduler or bin/plugin converter-studio work.
    VIDEO_TO: Videos become
    OFFICE: Office documents to PDF (Word, Excel, PowerPoint, OpenDocument, RTF)
    OFFICE_HELP: Visitors open a PDF in the browser instead of downloading a document they may not be able to open.
    AUDIO: Uncompressed audio to MP3 (WAV, AIFF, FLAC, WMA)
    AUDIO_HELP: A much smaller file that every browser plays.
    RESULTS: Converted files
    ORIGINALS: The original file
    ORIGINALS_HELP: Kept originals are moved to user/data/converter-studio/originals, which is not reachable from the web.
    ORIGINALS_KEEP: Keep it in user/data (not public)
    ORIGINALS_BESIDE: Leave it next to the converted file
    ORIGINALS_DELETE: Delete it
    IMAGE_QUALITY: Photo quality
    QUALITY_HIGH: High (larger files)
    QUALITY_BALANCED: Balanced
    QUALITY_SMALL: Small (smaller files)
    IMAGE_LONG_SIDE: Longest side of photos
    IMAGE_LONG_SIDE_HELP: Larger photos are scaled down; smaller ones are never enlarged.
    SIZE_KEEP: Keep the size
    KEEP_METADATA: Keep the photo details (EXIF)
    KEEP_METADATA_HELP: Camera, date and the like. Off by default, so photos are published without them; the GPS location is never kept.
    VIDEO_HEIGHT: Video size at most
    VIDEO_HEIGHT_HELP: Larger videos are scaled down; smaller ones are never enlarged.
    VIDEO_QUALITY: Video quality
    AUDIO_BITRATE: MP3 quality
    LIMITS: Limits
    MAX_CREDITS: Credits a file may cost without approval
    MAX_CREDITS_HELP: A conversion that costs more waits, and nothing is charged until you approve it with bin/plugin converter-studio confirm. Most photos and documents cost 1 credit; audio and video are priced by their length and size.
    UPLOAD_WAIT: Time an upload waits for its conversion
    UPLOAD_WAIT_HELP: A conversion that takes longer (a long video) finishes in the background.
    SECONDS: seconds
    SCHEDULER: Finish slow conversions with Grav's scheduler
    SCHEDULER_HELP: Needs Grav's scheduler in cron (bin/grav scheduler). Without it, run bin/plugin converter-studio work.
    FIX_REFERENCES: Update links to converted files when a page is saved
    FIX_REFERENCES_HELP: The editor inserts an uploaded file under its original name (photo.heic). When the page is saved, such links point to the converted file (photo.jpg) instead.
